site_name: Inventaire du mobilier
site_description: Catalogue illustré d'un inventaire de mobilier ancien
site_author: Nicolas Coquet
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom

plugins:
  - search:
      lang: fr

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md
  - Catalogue: catalogue/index.md
  - Mode d'emploi: mode-emploi.md

copyright: Inventaire personnel — photographies et notices sous la responsabilité de leur propriétaire

