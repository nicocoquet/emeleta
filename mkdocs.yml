site_name: Emeleta
site_description: Catalogue illustré du mobilier et des livres anciens
site_author: Nicolas Coquet
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  logo: favicon.png
  favicon: favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mode sombre / Dark / Scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mode clair / Light / Chiaro

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Catalogue: Catalogue
            Bibliothèque: Library
            Statistiques: Statistics
            Contacts: Contact
          theme:
            language: en
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Accueil: Home
            Catalogue: Catalogo
            Bibliothèque: Biblioteca
            Statistiques: Statistiche
            Contacts: Contatti
          theme:
            language: it
  - search:
      lang:
        - fr
        - en
        - it

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/catalogue-filters.js
  - javascripts/contact-form.js

nav:
  - Accueil: index.md
  - Catalogue: catalogue/index.md
  - Bibliothèque: bibliotheque/index.md
  - Statistiques: statistiques.md
  - Contacts: contacts.md

